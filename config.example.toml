# vibe-usage configuration
# Copy this file to ~/.vibe-usage/config.toml and edit as needed.

# ── Remote sync ─────────────────────────────────────────────────────
# rsync target for push/pull across machines.
remote = "user@host:~/.vibe-usage"

# ── Subscriptions ───────────────────────────────────────────────────
# Tools billed by subscription (flat monthly rate) instead of per-token.
# The dashboard shows subscription cost; API-equivalent cost is still
# calculated for comparison.

[[subscriptions]]
tool = "claude"       # must match collector name: claude, gemini, codex, kimi
plan = "Team"
monthly_usd = 30.0

[[subscriptions]]
tool = "codex"
plan = "Plus"
monthly_usd = 20.0

[[subscriptions]]
tool = "gemini"
plan = "Pro"
monthly_usd = 30.0

# ── Custom model pricing ───────────────────────────────────────────
# Add or override model pricing (per token, USD).
# Field names align with LiteLLM's pricing format.
# Models are matched by checking if the model name contains match_pattern.
# Custom entries are appended after built-in defaults.
#
# Built-in models (no config needed):
#   opus, sonnet, haiku, gemini-3-pro, gemini-3-flash, gemini-2.5-pro,
#   gpt-5, gpt-5-codex, gpt-5.1-codex, gpt-5.3-codex, gpt-5.4
