name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${{ github.ref_name }} already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Fetch model pricing data
        run: |
          curl -sSfL -o model_prices.json \
            "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN=vibe-usage
          ARCHIVE="${BIN}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE}"
          cp "target/${{ matrix.target }}/release/${BIN}" "${ARCHIVE}/"
          cp config.example.toml "${ARCHIVE}/"
          cp README.md "${ARCHIVE}/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: vibe-usage-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: [check, build]
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"

  homebrew:
    needs: [check, release]
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "aarch64_darwin=$(sha256sum vibe-usage-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin=$(sha256sum vibe-usage-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux=$(sha256sum vibe-usage-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux=$(sha256sum vibe-usage-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA_AARCH64_DARWIN: ${{ steps.sha.outputs.aarch64_darwin }}
          SHA_X86_64_DARWIN: ${{ steps.sha.outputs.x86_64_darwin }}
          SHA_X86_64_LINUX: ${{ steps.sha.outputs.x86_64_linux }}
          SHA_AARCH64_LINUX: ${{ steps.sha.outputs.aarch64_linux }}
        run: |
          # Strip leading 'v' for formula version
          FORMULA_VERSION="${VERSION#v}"
          BASE_URL="https://github.com/cross-entropy-ai/vibe-usage/releases/download/${VERSION}"

          cat > vibe-usage.rb << FORMULA
          class VibeUsage < Formula
            desc "Collect and analyze conversation data from AI coding tools"
            homepage "https://github.com/cross-entropy-ai/vibe-usage"
            version "${FORMULA_VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/vibe-usage-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_DARWIN}"
              else
                url "${BASE_URL}/vibe-usage-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/vibe-usage-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_AARCH64_LINUX}"
              else
                url "${BASE_URL}/vibe-usage-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_64_LINUX}"
              end
            end

            def install
              bin.install "vibe-usage"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/vibe-usage --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' vibe-usage.rb

          # Push updated formula to homebrew tap.
          #
          # The GitHub Actions runner may have credential helpers (e.g. gh CLI)
          # or extraheader configs that intercept HTTPS requests and inject
          # GITHUB_TOKEN, which only has access to the current repo. We must
          # neutralise all of these before cloning with our cross-repo PAT.
          #
          # 1. Wipe any credential helpers at every config level.
          # 2. Set credential.helper to "" (empty string) which tells git
          #    "I have a helper and it produces nothing", preventing fallback
          #    to any system-level helper.
          # 3. Clear any extraheader that actions/checkout may have left
          #    at global level (belt-and-suspenders; this job has no checkout).
          git config --global --unset-all credential.helper || true
          git config --system --unset-all credential.helper 2>/dev/null || true
          git config --global credential.helper ""
          git config --global --unset-all "http.https://github.com/.extraheader" || true

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cross-entropy-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp vibe-usage.rb tap/Formula/vibe-usage.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vibe-usage.rb
          git commit -m "vibe-usage ${VERSION}"
          git push
